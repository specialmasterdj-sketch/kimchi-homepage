name: Update YouTube videos

on:
  schedule:
    - cron: "17 */4 * * *"   # 4시간마다
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_videos.py
      - name: Commit if changed
        run: |
          if git diff --quiet assets/videos.json; then echo "no change"; exit 0; fi
          git config user.name "kimchi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/videos.json
          git commit -m "YouTube 최신 영상 자동 업데이트"
          git push
